# COCO8-pose dataset (first 8 images from COCO train2017) by Ultralytics
# Documentation: https://docs.ultralytics.com/datasets/pose/coco8-pose/
# Example usage: yolo train data=coco8-pose.yaml
# parent
# ├── work
# │   ├── coco8-pose.yaml  <-- 本配置文件
# │   └── datasets
# │       └── coco8-pose  ← 数据集下载路径 (1 MB)

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: /home/xiexingrong/ACUpose/yolov13/work/datasets/coco8-pose  # 数据集根目录（使用绝对路径，确保下载到work目录下）
train: images/train  # 训练集图片路径（相对于path）4张图片
val: images/val      # 验证集图片路径（相对于path）4张图片
test:  # 测试集（可选，留空）

# Keypoints 关键点配置
kpt_shape: [17, 3]  # 17个关键点，每个包含(x,y,可见性)3个维度
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15]  # 左右翻转映射关系

# Classes 类别配置
names:
  0: person  # 仅包含人体类别

# Download script/URL (optional) 下载链接
# 注意：即使设置了绝对路径，下载功能仍然会先下载到DATASETS_DIR
# 如果数据集已存在，可以删除或注释掉download字段
# 如果需要自动下载，请使用下面的Python脚本方式
download: |
  from pathlib import Path
  from ultralytics.utils.downloads import safe_download
  
  # 目标目录：work/datasets
  target_dir = Path("/home/xiexingrong/ACUpose/yolov13/work/datasets")
  target_dir.mkdir(parents=True, exist_ok=True)
  
  # 下载并解压到目标目录
  url = "https://github.com/ultralytics/assets/releases/download/v0.0.0/coco8-pose.zip"
  safe_download(url=url, dir=target_dir, unzip=True, delete=True)